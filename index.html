<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harry AI - Restaurant Booking Agent for London</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #172033;
      line-height: 1.6;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .nav {
      max-width: 1100px;
      margin: auto;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      color: #1769aa;
    }

    .logo span {
      color: #111827;
    }

    .nav a {
      text-decoration: none;
      color: #374151;
      margin-left: 22px;
      font-weight: 600;
    }

    .hero {
      background: linear-gradient(135deg, #1769aa, #38a3db);
      color: white;
      padding: 80px 20px;
    }

    .hero-content {
      max-width: 1100px;
      margin: auto;
      text-align: center;
    }

    .hero h1 {
      font-size: 48px;
      line-height: 1.15;
      margin-bottom: 20px;
    }

    .hero p {
      max-width: 700px;
      margin: 0 auto 30px;
      font-size: 20px;
      opacity: 0.95;
    }

    .button {
      display: inline-block;
      background: white;
      color: #1769aa;
      border: none;
      padding: 14px 28px;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }

    .button:hover {
      opacity: 0.9;
    }

    .section {
      max-width: 1100px;
      margin: auto;
      padding: 65px 20px;
    }

    .section-title {
      text-align: center;
      font-size: 34px;
      margin-bottom: 12px;
    }

    .section-subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 40px;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .card {
      background: white;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    .card-icon {
      font-size: 38px;
      margin-bottom: 12px;
    }

    .card h3 {
      margin-bottom: 10px;
      font-size: 21px;
    }

    .card p {
      color: #6b7280;
    }

    .booking {
      background: white;
      border-radius: 20px;
      padding: 35px;
      max-width: 750px;
      margin: auto;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 16px;
      background: white;
    }

    .book-button {
      width: 100%;
      padding: 15px;
      background: #1769aa;
      color: white;
      border: none;
      border-radius: 9px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .book-button:hover {
      background: #125586;
    }

    #result {
      display: none;
      margin-top: 22px;
      padding: 18px;
      border-radius: 10px;
      background: #ecfdf5;
      color: #065f46;
      font-weight: 600;
    }

    .restaurants {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .restaurant {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    .restaurant-image {
      height: 180px;
      background: linear-gradient(135deg, #dbeafe, #bfdbfe);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 65px;
    }

    .restaurant-info {
      padding: 22px;
    }

    .restaurant-info h3 {
      margin-bottom: 8px;
    }

    .restaurant-info p {
      color: #6b7280;
    }

    footer {
      background: #111827;
      color: white;
      text-align: center;
      padding: 30px 20px;
      margin-top: 30px;
    }
